[project]
name = "agentfork"
version = "0.4.0"
description = "Reference components and benchmarks for coordinated sandbox and LLM KV-cache branching"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.0"]
kvzip = [
    "torch>=2.3.0",
    "transformers>=4.44.0",
    "accelerate>=0.30.0",
    "peft>=0.20.0",
    "vllm>=0.27.1",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "huggingface-hub",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that take more than a few seconds",
    "gpu: tests that require a CUDA GPU",
    "leaderboard: tests that download/run external benchmark datasets",
]

[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentfork*"]

[tool.setuptools.package-data]
agentfork = ["py.typed"]
