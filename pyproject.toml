[project]
name = "agentfork"
version = "0.4.0"
description = "Reference components and benchmarks for coordinated sandbox and LLM KV-cache branching"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# demo/ is importable from the repo root: tests/test_race_demo.py drives
# demo/race_demo.py, and without this it would silently skip instead of run.
pythonpath = ["."]

[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentfork*"]

[tool.setuptools.package-data]
agentfork = ["py.typed"]
